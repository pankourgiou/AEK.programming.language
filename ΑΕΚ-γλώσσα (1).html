<style>
:root{--bg:#0a0907;--panel:#13110b;--raise:#1b1810;--line:#2e2814;--tx:#f1e9d0;--mut:#a39a7c;--y:#ffd100;--st:#9be28a;--nu:#ffa94d;--cm:#6f6a58;--fn:#7cc4ff;--li:#ff7ab6;--er:#ff7b6b;
--mono:"JetBrains Mono",ui-monospace,Consolas,Menlo,"DejaVu Sans Mono",monospace;--ui:"Manrope",system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:500 14px/1.45 var(--ui);display:flex;flex-direction:column}
@media(min-width:861px){body{height:100vh}}
header{display:flex;align-items:center;gap:16px;padding:12px 22px;background:#000;border-bottom:3px solid var(--y)}
.crest{height:66px;width:auto;filter:drop-shadow(0 4px 10px rgba(255,209,0,.18))}
h1{margin:0;flex:1;font:800 34px/1 var(--ui);letter-spacing:.06em;color:var(--y)}
h1 small{display:block;margin-top:6px;font:500 12.5px var(--ui);letter-spacing:.02em;color:var(--mut)}
.clock{font:700 22px/1.1 var(--mono);color:var(--tx);text-align:right;margin-right:8px}
.clock small{display:block;margin-top:3px;font:500 11.5px var(--ui);color:var(--mut)}
.btn{font:800 13px var(--ui);color:var(--tx);background:transparent;border:1.5px solid var(--line);padding:9px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--y);color:var(--y)}
.btn.p{background:var(--y);border-color:var(--y);color:#000}.btn.p:hover{color:#000;filter:brightness(1.08)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--y);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px 22px 22px;min-height:0}
@media(max-width:860px){main{grid-template-columns:1fr}aside{max-height:360px}.work{grid-template-rows:380px 200px!important}h1{font-size:26px}.crest{height:52px}.clock{font-size:16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.work{display:grid;grid-template-rows:minmax(0,1fr) minmax(150px,.42fr);gap:16px;min-height:0}
.hd{display:flex;align-items:center;gap:10px;padding:0 14px;height:42px;border-bottom:1px solid var(--line);font:800 12.5px var(--ui);color:var(--mut)}
.hd input{background:transparent;border:0;border-bottom:2px solid var(--y);color:var(--tx);font:700 13px var(--mono);padding:2px 4px;width:230px;max-width:100%}
.hd .hint{margin-left:auto;font-weight:500;color:var(--y)}
/* sidebar */
aside .tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:800 13.5px var(--ui);padding:13px 8px 10px;cursor:pointer}
.tabs button.on{color:var(--y);border-bottom-color:var(--y)}
.list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.list[hidden]{display:none}
.item{all:unset;box-sizing:border-box;display:block;cursor:pointer;padding:10px 12px;border-radius:10px;background:var(--raise);border:1px solid var(--line);border-left:4px solid var(--line)}
.item:hover,.item.on{border-color:var(--y)}
.item:focus-visible{outline:2px solid var(--y)}
.item b{display:block;font:800 14px var(--ui);color:var(--tx)}
.item span{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.item code{display:block;margin-top:8px;padding:8px 10px;border-radius:8px;background:#0a0907;font:12.5px/1.6 var(--mono);white-space:pre;overflow-x:auto;color:var(--tx)}
.item.cmd b{font:700 13px var(--mono);color:var(--y)}
.how{padding:12px 14px;border-radius:10px;background:var(--y);color:#000;font-weight:800;line-height:1.5}
.how span{display:block;font-weight:500;margin-top:4px;font-size:12.5px}
/* editor */
.ed{position:relative;flex:1;display:flex;min-height:0}
.gut{width:48px;padding:14px 10px 14px 0;text-align:right;color:var(--cm);font:14px/22px var(--mono);overflow:hidden;white-space:pre;border-right:1px solid var(--line);user-select:none}
.code{position:relative;flex:1;min-width:0}
.code pre,.code textarea{position:absolute;inset:0;margin:0;border:0;font:14px/22px var(--mono);tab-size:2;white-space:pre;word-wrap:normal}
.code pre{padding:14px 30px 30px 14px;overflow:hidden;pointer-events:none}
.code textarea{padding:14px;resize:none;overflow:auto;background:transparent;color:transparent;caret-color:var(--y)}
.code textarea::selection{background:rgba(255,209,0,.42);color:transparent}

<script>
"use strict";
/* ---------- helpers ---------- */
const strip=w=>w.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ς/g,"σ");
const KW={};
[["let","έστω"],["print","γράψε"],["if","αν"],["then","τότε"],["else","αλλιώς"],["while","όσο"],["do","κάνε"],["end","τέλος"],
["for","για"],["from","από"],["to","ως","εως"],["step","βήμα"],["func","συνάρτηση"],["ret","επίστρεψε"],["and","και"],["or","ή"],
["not","όχι"],["true","αληθές"],["false","ψευδές"],["null","τίποτα"]]
.forEach(([c,...ws])=>ws.forEach(w=>KW[strip(w)]=c));
class AekError extends Error{constructor(m,l){super(m);this.line=l}}
const fmt=(v,q)=>v===null?"τίποτα":v===true?"αληθές":v===false?"ψευδές":typeof v=="number"?String(+v.toPrecision(12)):
  typeof v=="string"?(q?JSON.stringify(v):v):Array.isArray(v)?"["+v.map(x=>fmt(x,1)).join(", ")+"]":"<συνάρτηση "+(v.name||"")+">";
const truthy=v=>v!==false&&v!==null&&v!==0&&v!=="";

/* ---------- lexer ---------- */
function lex(src,off){
  const re=/(\s+)|(\/\/[^\n]*|#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\d+(?:\.\d+)?)|([\p{L}_][\p{L}\p{N}_]*)|(==|!=|<=|>=|[-+*\/%^<>=(),\[\]])/uy;
  const T=[];let line=1+off,pos=0;
  while(pos<src.length){
    re.lastIndex=pos;const m=re.exec(src);
    if(!m)throw new AekError("Άγνωστος χαρακτήρας «"+src[pos]+"»",line);
    pos=re.lastIndex;
    if(m[1])line+=(m[1].match(/\n/g)||[]).length;
    else if(m[3])T.push({t:"str",v:m[3].slice(1,-1).replace(/\\(.)/g,(_,c)=>c=="n"?"\n":c=="t"?"\t":c),line});
    else if(m[4])T.push({t:"num",v:parseFloat(m[4]),line});
    else if(m[5]){const s=strip(m[5]),k=KW[s.toLowerCase()];T.push(k?{t:"kw",v:k,line}:{t:"id",v:s,line})}
    else if(m[6])T.push({t:"op",v:m[6],line});
  }
  return T;
}

/* ---------- parser ---------- */
function parse(T){
  let p=0;const peek=()=>T[p],next=()=>T[p++];
  const lastLine=()=>T.length?T[T.length-1].line:1;
  const err=m=>{throw new AekError(m,peek()?peek().line:lastLine())};
  const isK=v=>peek()&&peek().t=="kw"&&peek().v==v;
  const isO=v=>peek()&&peek().t=="op"&&peek().v==v;
  const eatK=(v,n)=>isK(v)?next():err("Περίμενα «"+n+"»");
  const eatO=v=>isO(v)?next():err("Περίμενα «"+v+"»");
  const ident=()=>peek()&&peek().t=="id"?next().v:err("Περίμενα όνομα");
  function block(stops){const o=[];while(p<T.length&&!(peek().t=="kw"&&stops.includes(peek().v)))o.push(stmt());return o}
  function ifs(elif){
    const line=next().line,c=expr();eatK("then","τότε");
    const a=block(["else","end"]);let b=[];
    if(isK("else")){next();if(isK("if"))b=[ifs(true)];else b=block(["end"])}
    if(!elif)eatK("end","τέλος");
    return{k:"if",c,a,b,line};
  }
  function stmt(){
    const t=peek(),line=t.line;
    if(t.t=="kw")switch(t.v){
      case"let":{next();const name=ident();eatO("=");return{k:"let",name,e:expr(),line}}
      case"print":{next();const a=[expr()];while(isO(",")){next();a.push(expr())}return{k:"print",a,line}}
      case"if":return ifs(false);
      case"while":{next();const c=expr();eatK("do","κάνε");const b=block(["end"]);eatK("end","τέλος");return{k:"while",c,b,line}}
      case"for":{next();const v=ident();eatK("from","από");const a=expr();eatK("to","ως");const z=expr();
        let s=null;if(isK("step")){next();s=expr()}eatK("do","κάνε");const b=block(["end"]);eatK("end","τέλος");return{k:"for",v,a,z,s,b,line}}
      case"func":{next();const name=ident();eatO("(");const ps=[];
        if(!isO(")")){ps.push(ident());while(isO(",")){next();ps.push(ident())}}eatO(")");
        const b=block(["end"]);eatK("end","τέλος");return{k:"func",name,ps,b,line}}
      case"ret":{next();const q=peek();return{k:"ret",e:(!q||(q.t=="kw"&&(q.v=="end"||q.v=="else")))?null:expr(),line}}
    }
    const e=expr();
    if(isO("=")){if(e.k!="var"&&e.k!="idx")err("Μη έγκυρος στόχος εκχώρησης");next();return{k:"assign",t:e,e:expr(),line}}
    return{k:"expr",e,line};
  }
  const bin=(sub,ops)=>()=>{let l=sub();while(peek()&&((peek().t=="op"&&ops.includes(peek().v))||(peek().t=="kw"&&ops.includes(peek().v)))){const o=next().v;l={k:"bin",o,l,r:sub()}}return l};
  const prim=()=>{
    const t=next();if(!t)err("Απροσδόκητο τέλος κώδικα");
    if(t.t=="num"||t.t=="str")return{k:"lit",v:t.v};
    if(t.t=="id")return{k:"var",n:t.v};
    if(t.t=="kw"){if(t.v=="true")return{k:"lit",v:true};if(t.v=="false")return{k:"lit",v:false};if(t.v=="null")return{k:"lit",v:null}}
    if(t.t=="op"&&t.v=="("){const e=expr();eatO(")");return e}
    if(t.t=="op"&&t.v=="["){const a=[];if(!isO("]")){a.push(expr());while(isO(",")){next();a.push(expr())}}eatO("]");return{k:"list",a}}
    p--;err("Μη αναμενόμενο «"+(t.v)+"»");
  };
  const post=()=>{let e=prim();for(;;){
    if(isO("(")){next();const a=[];if(!isO(")")){a.push(expr());while(isO(",")){next();a.push(expr())}}eatO(")");e={k:"call",f:e,a}}
    else if(isO("[")){next();const i=expr();eatO("]");e={k:"idx",o:e,i}}else return e}};
  const pow=()=>{const b=post();if(isO("^")){next();return{k:"bin",o:"^",l:b,r:unary()}}return b};
  const unary=()=>{if(isO("-")){next();return{k:"neg",e:unary()}}if(isK("not")){next();return{k:"not",e:unary()}}return pow()};
  const mul=bin(unary,["*","/","%"]),add=bin(mul,["+","-"]),cmp=bin(add,["==","!=","<",">","<=",">="]);
  const and=bin(cmp,["and"]),expr_=bin(and,["or"]);
  function expr(){return expr_()}
  const ast=[];while(p<T.length)ast.push(stmt());return ast;
}

/* ---------- interpreter ---------- */
class Ret{constructor(v){this.v=v}}
let curLine=1,steps=0,depth=0,OUT=[];
const rt=m=>{throw new AekError(m,curLine)};
const mk=p=>({v:new Map(),p});
const find=(e,k)=>{for(;e;e=e.p)if(e.v.has(k))return e;return null};
const num=(v,w)=>typeof v=="number"?v:rt("Η "+w+" θέλει αριθμό, πήρε "+fmt(v,1));
const B={};
const def=(names,f)=>names.split(" ").forEach(n=>B[strip(n)]=f);
def("μήκος",a=>(typeof a=="string"||Array.isArray(a))?a.length:rt("Το μήκος θέλει κείμενο ή λίστα"));
def("ρίζα",a=>Math.sqrt(num(a,"ρίζα")));
def("τυχαίο",(a,b)=>a===undefined?Math.random():b===undefined?1+Math.floor(Math.random()*a):a+Math.floor(Math.random()*(b-a+1)));
def("στρογγυλό",(a,d=0)=>{const m=10**d;return Math.round(num(a,"στρογγυλό")*m)/m});
def("πάτωμα",a=>Math.floor(num(a,"πάτωμα")));
def("απόλυτο",a=>Math.abs(num(a,"απόλυτο")));
def("μέγιστο",(...a)=>Math.max(...(Array.isArray(a[0])?a[0]:a)));
def("ελάχιστο",(...a)=>Math.min(...(Array.isArray(a[0])?a[0]:a)));
def("κείμενο",a=>fmt(a));
def("αριθμός",a=>{const n=parseFloat(a);return isNaN(n)?rt("Δεν μετατρέπεται σε αριθμό"):n});
def("προσθήκη",(l,v)=>{if(!Array.isArray(l))rt("Η προσθήκη θέλει λίστα");l.push(v);return l});
def("κεφαλαία",s=>String(s).toUpperCase());
def("μικρά",s=>String(s).toLowerCase());
const p2=n=>String(n).padStart(2,"0");
def("ρολόι",()=>{const d=new Date();return p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds())});
def("ημερομηνία",()=>{const d=new Date();return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()});
def("ώρα",()=>new Date().getHours());
def("λεπτά",()=>new Date().getMinutes());
def("δευτερόλεπτα",()=>new Date().getSeconds());
const baseEnv=()=>{const e=mk(null);for(const k in B)e.v.set(k,B[k]);return e};
let G=baseEnv();
const tick=()=>{if(++steps>3e6)rt("Πάρα πολλά βήματα — ατέρμων βρόχος;")};

function ev(n,env){
  switch(n.k){
    case"lit":return n.v;
    case"var":{const e=find(env,n.n);if(!e)rt("Άγνωστη μεταβλητή «"+n.n+"»");return e.v.get(n.n)}
    case"list":return n.a.map(x=>ev(x,env));
    case"neg":return-num(ev(n.e,env),"αλλαγή προσήμου");
    case"not":return!truthy(ev(n.e,env));
    case"idx":{const o=ev(n.o,env),i=ev(n.i,env);if(!(typeof o=="string"||Array.isArray(o)))rt("Δεν γίνεται δείκτης εδώ");
      if(!Number.isInteger(i)||i<0||i>=o.length)rt("Δείκτης "+fmt(i,1)+" εκτός ορίων (0–"+(o.length-1)+")");return o[i]}
    case"call":{
      const f=ev(n.f,env),a=n.a.map(x=>ev(x,env));
      if(typeof f=="function")return f(...a);
      if(!(f&&f.body))rt("Δεν μπορεί να κληθεί");
      if(a.length!=f.ps.length)rt("Η «"+f.name+"» θέλει "+f.ps.length+" ορίσματα, πήρε "+a.length);
      if(++depth>400){depth=0;rt("Υπερβολική αναδρομή")}
      const e=mk(f.env);f.ps.forEach((q,i)=>e.v.set(q,a[i]));let r=null;
      try{exec(f.body,e)}catch(x){if(x instanceof Ret)r=x.v;else throw x}finally{depth--}
      return r}
    case"bin":{
      const o=n.o;
      if(o=="and"){const l=ev(n.l,env);return truthy(l)?truthy(ev(n.r,env)):false}
      if(o=="or"){const l=ev(n.l,env);return truthy(l)?true:truthy(ev(n.r,env))}
      const l=ev(n.l,env),r=ev(n.r,env);
      switch(o){
        case"+":if(typeof l=="string"||typeof r=="string")return fmt(l)+fmt(r);if(Array.isArray(l)&&Array.isArray(r))return l.concat(r);return num(l,"πρόσθεση")+num(r,"πρόσθεση");
        case"-":return num(l,"αφαίρεση")-num(r,"αφαίρεση");
        case"*":return num(l,"πολλαπλασιασμός")*num(r,"πολλαπλασιασμός");
        case"/":if(num(r,"διαίρεση")===0)rt("Διαίρεση με το μηδέν");return num(l,"διαίρεση")/r;
        case"%":if(num(r,"υπόλοιπο")===0)rt("Διαίρεση με το μηδέν");return num(l,"υπόλοιπο")%r;
        case"^":return Math.pow(num(l,"δύναμη"),num(r,"δύναμη"));
        case"==":return JSON.stringify(l)===JSON.stringify(r);
        case"!=":return JSON.stringify(l)!==JSON.stringify(r);
        case"<":return l<r;case">":return l>r;case"<=":return l<=r;case">=":return l>=r;
      }}
  }
  rt("Άγνωστη έκφραση");
}
function exec(list,env){
  for(const s of list){
    tick();curLine=s.line;
    switch(s.k){
      case"let":env.v.set(s.name,ev(s.e,env));break;
      case"print":OUT.push(["",s.a.map(x=>fmt(ev(x,env))).join(" ")]);break;
      case"expr":ev(s.e,env);break;
      case"assign":{const v=ev(s.e,env);
        if(s.t.k=="var"){const e=find(env,s.t.n)||env;e.v.set(s.t.n,v)}
        else{const o=ev(s.t.o,env),i=ev(s.t.i,env);if(!Array.isArray(o))rt("Εκχώρηση δείκτη μόνο σε λίστες");
          if(!Number.isInteger(i)||i<0||i>=o.length)rt("Δείκτης εκτός ορίων");o[i]=v}break}
      case"if":exec(truthy(ev(s.c,env))?s.a:s.b,env);break;
      case"while":while(truthy(ev(s.c,env))){tick();exec(s.b,env)}break;
      case"for":{const a=num(ev(s.a,env),"«για»"),z=num(ev(s.z,env),"«για»");
        const st=s.s?num(ev(s.s,env),"βήμα"):(a<=z?1:-1);if(st===0)rt("Το βήμα δεν μπορεί να είναι 0");
        for(let i=a;st>0?i<=z:i>=z;i+=st){tick();(find(env,s.v)||env).v.set(s.v,i);exec(s.b,env)}break}
      case"func":env.v.set(s.name,{name:s.name,ps:s.ps,body:s.b,env});break;
      case"ret":throw new Ret(s.e?ev(s.e,env):null);
    }
  }
}

const $=id=>document.getElementById(id);
const ta=$("ta"),hl=$("hl"),gut=$("gut"),out=$("out");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function highlight(src){
  const re=/(\/\/[^\n]*|#[^\n]*)|("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)|(\d+(?:\.\d+)?)|([\p{L}_][\p{L}\p{N}_]*)|([-+*\/%^<>=!]+)/gu;
  let o="",last=0,m;
  while((m=re.exec(src))){
    o+=esc(src.slice(last,m.index));last=re.lastIndex;
    const t=esc(m[0]);
    if(m[1])o+='<span class="c">'+t+"</span>";
    else if(m[2])o+='<span class="s">'+t+"</span>";
    else if(m[3])o+='<span class="n">'+t+"</span>";
    else if(m[4]){const s=strip(m[4]),k=KW[s.toLowerCase()];
      if(k)o+='<span class="'+(k=="true"||k=="false"||k=="null"?"l":"k")+'">'+t+"</span>";
      else if(B[s]||/^\s*\(/.test(src.slice(last,last+4)))o+='<span class="f">'+t+"</span>";
      else o+=t}
    else o+='<span class="o">'+t+"</span>";
  }
  return o+esc(src.slice(last));
}


function refresh(){
  hl.innerHTML=highlight(ta.value)+"\n";
  const n=ta.value.split("\n").length;gut.textContent=Array.from({length:n},(_,i)=>i+1).join("\n");

}

  if(e.key=="Tab"){e.preventDefault();ta.setRangeText("  ",ta.selectionStart,ta.selectionEnd,"end");refresh()}

function line(cls,txt){const d=document.createElement("div");d.className=cls;d.textContent=txt;out.appendChild(d)}
function run(){
  const s=ta.selectionStart,e=ta.selectionEnd;if(e<=s)return;
  if(s==0&&e==ta.value.length)G=baseEnv();
  const src=ta.value.slice(s,e),off=ta.value.slice(0,s).split("\n").length-1;
  out.textContent="";OUT=[];steps=0;depth=0;let err=null;
  try{exec(parse(lex(src,off)),G)}
  catch(x){err=x instanceof AekError?"Γραμμή "+x.line+": "+x.message:x instanceof RangeError?"Υπερβολική αναδρομή":x.message}
  OUT.forEach(o=>line("",o[1]));
  if(err)line("er","✖ "+err);else if(!OUT.length)line("mt","✔");
}

ta.addEventListener("pointerdown",()=>{down=true});
addEventListener("pointerup",()=>{down=false});
addEventListener("pointercancel",()=>{down=false});
setInterval(()=>{
  const s=ta.selectionStart,e=ta.selectionEnd,k=e>s?s+":"+e+":"+ta.value.slice(s,e):"";
  if(k!==prev){prev=k;return}
  if(!k){done="";return}
  if(k!==done&&!down){done=k;run()}
},250);

$("l2").appendChild(how);
CMDS.forEach(it=>$("l2").appendChild(item(it,true,()=>{const v=ta.value.replace(/\s+$/,"");pick(it.c,v?v+"\n\n":"")})));
function tab(n){["1","2"].forEach(i=>{$("t"+i).classList.toggle("on",i==n);$("l"+i).hidden=i!=n})}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);

/* ---------- ρολόι ---------- */
function tick2(){$("clock").innerHTML=B[strip("ρολόι")]()+"<small>"+B[strip("ημερομηνία")]()+"</small>"}
tick2();setInterval(tick2,1000);

/* ---------- αρχεία .ΑΕΚ ---------- */
$("open").onclick=()=>$("file").click();
function loadFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=r.result;$("fname").value=f.name;refresh()};r.readAsText(f,"utf-8")}
$("file").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
ta.addEventListener("dragover",e=>e.preventDefault());
ta.addEventListener("drop",e=>{if(e.dataTransfer.files.length){e.preventDefault();loadFile(e.dataTransfer.files[0])}});
function save(){
  let n=$("fname").value.trim()||"πρόγραμμα";if(!/\.αεκ$/i.test(n))n+=".ΑΕΚ";$("fname").value=n;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ta.value],{type:"text/plain;charset=utf-8"}));
  a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$("save").onclick=save;

ta.value=EXS[0].c;refresh();
$("l1").firstChild.classList.add("on");
out.innerHTML='<span class="mt">Κάνε highlight στον κώδικα (ή Ctrl+A για όλο) και το αποτέλεσμα εμφανίζεται εδώ.</span>';
</script>
</body>
</html>
